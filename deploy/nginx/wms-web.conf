server {
    listen 80;
    server_name _;

    # 프론트 빌드 결과(dist)가 놓이는 자리
    root /var/www/wms-web;
    index index.html;

    # React는 화면이 여러 개여도 파일은 index.html 하나다.
    # 없는 경로는 전부 index.html로 넘겨야 새로고침해도 404가 안 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/ 로 시작하는 요청만 백엔드로. (개발 때 Vite 프록시가 하던 일)
    # nginx는 더 구체적인 경로를 우선하므로 위의 location / 보다 이쪽이 먼저 걸린다.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 액추에이터는 외부에 열지 않는다 (헬스체크는 서버 안에서만)
    location /actuator/ {
        deny all;
    }
}
